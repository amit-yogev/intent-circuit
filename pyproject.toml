[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-circuit"
version = "0.1.0"
description = "Detects AI coding agents trying to escape their sandbox"
requires-python = ">=3.13"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]